# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"
  - "Gemini"
ai_usage_summary: |
    Used Gemini and Claude for architecture design, refactoring, and optimizing candidate ranking logic.
    No candidate data was uploaded to external LLM APIs during the ranking process.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
    Multi-stage L1/L2 Candidate Ranking System. L1 screening performs O(1) set-intersection skill matching,
    fast string-matching for title fit, and direct behavioral signal scaling over all 100,000 candidates (completing in under 3 seconds).
    It also applies deterministic honeypot detection to filter out impossible profiles (duration-date mismatches, extreme expert-skill anomalies).
    L2 ranker encodes only the top 5,000 candidate profiles using sentence-transformers (all-MiniLM-L6-v2) for deep semantic matching,
    combined with a high-fidelity CandidateScorer.

